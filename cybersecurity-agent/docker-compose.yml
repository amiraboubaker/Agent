services:
  backend:
    build: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      LLM_API_URL: http://host.docker.internal:11434/v1/chat/completions
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ALLOWED_HOSTS: host.docker.internal
      DATABASE_URL: sqlite:///./data/agent.db
      CORS_ORIGINS: http://localhost:5174
    volumes:
      - cybersecurity-backend-data:/app/data
    ports:
      - "8001:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8001/api
    volumes:
      - ./frontend:/app
      - cybersecurity-frontend-node-modules:/app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  cybersecurity-backend-data:
  cybersecurity-frontend-node-modules:
